[package]
name = "mantash"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "A compact native terminal for local and SSH work"
license = "GPL-3.0-or-later"
homepage = "https://github.com/realmx/mantash"
repository = "https://github.com/realmx/mantash"
readme = "README.md"
default-run = "mantash"

[workspace]

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets", "dep:rfd", "dep:raw-window-handle", "dep:rust-embed", "dep:cocoa", "dep:objc", "dep:windows-sys", "dep:embed-resource"]

[dependencies]
anyhow = "1"
alacritty_terminal = "=0.26.0"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
directories = "6"
encoding_rs = "0.8"
gpui = { version = "=0.2.2", optional = true, default-features = false, features = ["runtime_shaders", "windows-manifest"] }
gpui-component = { version = "=0.5.1", optional = true }
gpui-component-assets = { version = "=0.5.1", optional = true }
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
getrandom = "=0.2.17"
libc = "0.2"
tempfile = "3"
parking_lot = "0.12"
portable-pty = "0.9"
rfd = { version = "0.17", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
# gpui-component-assets 在 debug 构建下默认从编译期的 registry 源码路径读取图标；
# 开启 debug-embed 将图标嵌入二进制，打包后的试用应用在任意机器都能渲染图标。
rust-embed = { version = "=8.12.0", optional = true, features = ["debug-embed"] }
rusqlite = { version = "0.38", features = ["bundled"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "=0.26.0", optional = true }
objc = { version = "=0.2.7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = { version = "=3.0.11", optional = true }

[dev-dependencies]
rand = "0.10"

[[bin]]
name = "mantash"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
# GPUI 0.2.2 pins taffy 0.9.0; the facade re-exports upstream taffy 0.9.2,
# which uses the fixed grid 1.x line. Remove it when GPUI relaxes that pin.
[patch.crates-io]
taffy = { path = "vendor/taffy-compat" }
