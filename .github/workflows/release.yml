name: Release

on:
  push:
    branches: ['build/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        required: true
        type: choice
        default: all
        options: [all, windows-x64, macos-arm64]

permissions:
  contents: write

jobs:
  prepare:
    name: Select targets and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.targets.outputs.version }}
      package_version: ${{ steps.targets.outputs.package_version }}
      publish: ${{ steps.targets.outputs.publish }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select tag or development build
        id: targets
        env:
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
        run: python3 scripts/release_matrix.py
      - name: Validate release tag
        if: steps.targets.outputs.publish == 'true'
        run: python3 scripts/release_version.py validate --version "${{ steps.targets.outputs.version }}"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Stage tag version in runner checkout
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          "${{ matrix.python }}" scripts/release_version.py stage --version "${{ needs.prepare.outputs.version }}"
      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin mantash
      - name: Package native installer
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          "${{ matrix.python }}" scripts/package_release.py \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/${{ startsWith(matrix.name, 'windows-') && 'mantash.exe' || 'mantash' }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --package-version "${{ needs.prepare.outputs.package_version }}" \
            --output-dir dist
      - name: Verify macOS disk image
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          base="MantaSH-${{ needs.prepare.outputs.package_version }}-${{ matrix.name }}"
          cd dist
          for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done
          /usr/bin/hdiutil verify "$base.dmg"
          mount="$RUNNER_TEMP/mantash-release-${{ matrix.name }}"
          mkdir -p "$mount"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$base.dmg"
          trap '/usr/bin/hdiutil detach "$mount"' EXIT
          app="$mount/MantaSH.app"
          test -L "$mount/Applications"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "${{ needs.prepare.outputs.version }}"
          /usr/bin/lipo -archs "$app/Contents/MacOS/mantash" | grep -qx "${{ matrix.name == 'macos-arm64' && 'arm64' || 'x86_64' }}"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          /usr/bin/codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for target in macos-arm64 macos-x64 windows-x86 windows-x64 windows-arm64; do
            base="MantaSH-${{ needs.prepare.outputs.version }}-${target}"
            if [[ "$target" == macos-* ]]; then
              first="$base.dmg"
            else
              first="$base-setup.exe"
            fi
            test -s "$first"
            test -s "$first.sha256"
            sha256sum -c "$first.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 10
      - name: Write release summary
        run: python3 scripts/release_notes.py --version "${{ needs.prepare.outputs.version }}" --output release-notes.md
      - name: Create draft release with verified packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MantaSH v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --prerelease=false --latest=true

  cask:
    name: Update optional Homebrew tap
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true' && vars.MANTASH_HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check tap credentials
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAP_SSH_KEY: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$TAP_TOKEN" ] || [ -n "$TAP_SSH_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Optional tap credentials are not configured; skipping cask update'
          fi
      - uses: actions/checkout@v4
        if: steps.tap.outputs.ready == 'true'
      - uses: actions/checkout@v4
        if: steps.tap.outputs.ready == 'true'
        with:
          repository: ${{ vars.MANTASH_HOMEBREW_TAP }}
          token: ${{ secrets.TAP_GITHUB_TOKEN || github.token }}
          ssh-key: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
          path: tap
      - uses: actions/download-artifact@v4
        if: steps.tap.outputs.ready == 'true'
        with:
          pattern: package-macos-*
          path: release
          merge-multiple: true
      - name: Update cask and push to tap
        if: steps.tap.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/update_homebrew_cask.py --version "$VERSION" --assets release --tap tap
          cd tap
          if [ -n "$(git status --porcelain Casks/mantash.rb)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add Casks/mantash.rb
            git commit -m "chore: bump MantaSH to v${VERSION}"
            git push
          fi
