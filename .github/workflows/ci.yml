name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust and documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test --locked --no-default-features --all-targets

      - name: Check core library
        run: cargo check --locked --no-default-features --all-targets

      - name: Validate documents and release helpers
        run: |
          python3 scripts/check_docs.py
          python3 -m py_compile scripts/release_version.py scripts/release_matrix.py scripts/package_release.py scripts/release_notes.py scripts/update_homebrew_cask.py
          python3 -m unittest discover -s tests -p 'test_release_*.py'
